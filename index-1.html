<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Jogos Zerados</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b5bf0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d29;--mut:#6b7086;--ac:#5b5bf0;--acx:#fff;--bd:#e3e5ef;--bad:#d64545;--ok:#1f9d63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151d;--card:#1e2030;--tx:#ecedf5;--mut:#9a9eb8;--ac:#8a8aff;--acx:#14151d;--bd:#2f3247;--bad:#ff7a7a;--ok:#4cc88d}}
:root[data-theme="dark"]{--bg:#14151d;--card:#1e2030;--tx:#ecedf5;--mut:#9a9eb8;--ac:#8a8aff;--acx:#14151d;--bd:#2f3247;--bad:#ff7a7a;--ok:#4cc88d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
input[type=text],input[type=password]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:14px}
.stats{display:flex;gap:10px}.stat{flex:1;text-align:center}.stat b{display:block;font-size:26px;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.name{font-weight:600}
.badge{background:var(--ac);color:var(--acx);border-radius:8px;padding:2px 8px;font-weight:700;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:18px;margin:0 0 8px}
.err.ok{color:var(--ok)}
.tabs,.seg{display:flex;gap:8px;margin-bottom:12px}.tabs button,.seg button{flex:1}
.seg button{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.hide{display:none}
.mini{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ac)}
.rate{display:flex;align-items:center;gap:12px}.rate output{font-size:24px;font-weight:700;color:var(--ac);min-width:44px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:10px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac)}nav .ic{font-size:20px}
.cv{width:44px;height:58px;border-radius:8px;object-fit:cover;flex:none;background:var(--bd)}
.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.it{display:flex;align-items:center;gap:10px;min-width:0}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pgin,#pend:not(.hide){animation:pgIn .3s ease both}
button{transition:transform .1s,background .2s,color .2s}
button:active{transform:scale(.96)}
nav button .ic{transition:transform .2s}
nav button.on .ic{transform:translateY(-2px) scale(1.15)}
@media (prefers-reduced-motion:reduce){.pgin,#pend:not(.hide){animation:none}button,nav button .ic{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section id="auth" class="card hide">
  <div class="mini"><button class="ghost sm" id="aLang" type="button">EN</button><button class="ghost sm" id="aTheme" type="button" aria-label="Theme">◐</button></div>
  <h1>🎮 Meus Jogos Zerados</h1>
  <p class="mut" data-i="authSub"></p>
  <div class="tabs"><button id="tLogin" type="button" data-i="login"></button><button id="tReg" class="ghost" type="button" data-i="reg"></button></div>
  <input type="text" id="user" data-ph="user" maxlength="20" autocomplete="username">
  <input type="password" id="pass" data-ph="pass" maxlength="12" autocomplete="current-password">
  <p class="err" id="aerr"></p>
  <button id="aok" type="button" style="width:100%" data-i="login"></button>
  <p class="mut" style="margin-top:12px" data-i="note"></p>
</section>

<section id="app" class="hide">
  <div class="top"><h1 id="ttl"></h1><span class="mut" id="who"></span></div>

  <div id="pg-search">
    <div class="card">
      <input type="text" id="q" data-ph="phQ" autocomplete="off">
      <div class="mut" id="cnt" style="margin-bottom:6px"></div>
      <div id="res"></div>
      <div id="pend" class="hide">
        <div class="it" style="margin-bottom:10px"><span id="pcv"></span><h2 id="pname" style="margin:0"></h2></div>
        <div style="margin-bottom:12px">
          <input type="text" id="cvUrl" data-ph="cvUrl" inputmode="url" autocomplete="off">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="ghost sm" id="cvPick" type="button" data-i="cvPick"></button><input type="file" id="cvFile" accept="image/*" class="hide"><span class="mut" id="cvMsg"></span></div>
        </div>
        <div class="rate"><input type="range" id="score" min="0" max="10" step="0.5" value="8"><output id="sv">8</output></div>
        <div style="display:flex;gap:8px;margin-top:12px"><button id="save" type="button" data-i="save"></button><button id="cancel" class="ghost" type="button" data-i="cancel"></button></div>
      </div>
    </div>
  </div>

  <div id="pg-done" class="hide">
    <div class="card stats">
      <div class="stat"><b id="sTot">0</b><span class="mut" data-i="finished"></span></div>
      <div class="stat"><b id="sAvg">–</b><span class="mut" data-i="avg"></span></div>
    </div>
    <div class="card">
      <input type="text" id="f" data-ph="phF">
      <div id="list"></div>
    </div>
  </div>

  <div id="pg-prof" class="hide">
    <div class="card">
      <h2 data-i="name"></h2>
      <input type="text" id="newName" maxlength="20" autocomplete="nickname">
      <p class="err" id="pmsg"></p>
      <button id="saveName" type="button" data-i="saveName"></button>
    </div>
    <div class="card">
      <h2 data-i="opts"></h2>
      <p class="mut" data-i="lang"></p>
      <div class="seg"><button id="bPt" type="button">Português</button><button id="bEn" type="button">English</button></div>
      <p class="mut" data-i="theme"></p>
      <div class="seg"><button id="bLight" type="button" data-i="light"></button><button id="bDark" type="button" data-i="dark"></button></div>
    </div>
    <div class="card">
      <h2 data-i="account"></h2>
      <button class="ghost" id="out" type="button" data-i="out"></button>
    </div>
  </div>
</section>

<p class="mut" style="text-align:center">Game data: <a href="https://rawg.io" target="_blank" rel="noopener" style="color:var(--ac)">RAWG</a></p>
</div>
<nav id="nav" class="hide">
  <button id="n-search" type="button"><span class="ic">🔍</span><span data-i="nSearch"></span></button>
  <button id="n-done" type="button"><span class="ic">✅</span><span data-i="nDone"></span></button>
  <button id="n-prof" type="button"><span class="ic">👤</span><span data-i="nProf"></span></button>
</nav>

  try{
    const body=JSON.stringify(mode==="reg"?{email:em(u),password:p,data:{name:u}}:{email:em(u),password:p});
    const r=await sb(mode==="reg"?"/auth/v1/signup":"/auth/v1/token?grant_type=password",{method:"POST",body,anon:true});
    const d=await r.json();
    if(!r.ok||!d.access_token){
      const m=(d.msg||d.error_description||d.message||"").toLowerCase();
      $("aerr").textContent=/already|registered/.test(m)?t("eTaken"):(mode==="reg"&&r.ok)?t("eConf"):/invalid|credentials/.test(m)?t("eBad"):t("eNet");
    }else{setS(d);$("pass").value="";page="search";$("aerr").textContent="";await boot()}
  }catch(e){$("aerr").textContent=t("eNet")}
  $("aok").disabled=false;
};
$("out").onclick=async()=>{try{await sb("/auth/v1/logout",{method:"POST"})}catch(e){}S=null;save("jf_sb",null);U=null;me=null;show()};

function head(){$("ttl").textContent=t(TT[page]);$("who").textContent="👤 "+me_().name;$("cnt").textContent=t("catCount").replace("{n}",CAT.length)}
function go(p){
  page=p;PG.forEach(x=>{$("pg-"+x).classList.toggle("hide",x!==p);$("n-"+x).classList.toggle("on",x===p)});
  const el=$("pg-"+p);el.classList.remove("pgin");void el.offsetWidth;el.classList.add("pgin");
  head();$("pmsg").textContent="";if(p==="prof")$("newName").value=me_().name;window.scrollTo(0,0);
}
PG.forEach(p=>$("n-"+p).onclick=()=>go(p));
function show(){
  const ok=!!(me&&me_());
  $("auth").classList.toggle("hide",ok);$("app").classList.toggle("hide",!ok);$("nav").classList.toggle("hide",!ok);
  if(ok){go(page);render();search()}
}

function render(){
  const g=me_().games,f=norm($("f").value);
  $("sTot").textContent=g.length;
  $("sAvg").textContent=g.length?(g.reduce((a,x)=>a+x.score,0)/g.length).toFixed(1):"–";
  const items=g.map((x,i)=>({...x,i})).filter(x=>norm(x.name).includes(f)).reverse();
  $("list").innerHTML=items.length?items.map(x=>`<div class="row"><div class="it">${cvHtml(x.name,x.cover)}<div><div class="name">${esc(x.name)}</div><span class="mut">${x.date}</span></div></div><div style="display:flex;gap:8px;align-items:center"><span class="badge">${x.score}</span><button class="ghost sm" data-del="${x.i}" type="button" aria-label="✕">✕</button></div></div>`).join(""):'<p class="mut">'+t(g.length?"none":"empty")+"</p>";
}
$("f").oninput=render;
$("list").onclick=async e=>{
  const i=e.target.dataset.del;if(i===undefined)return;const g=U.games[+i];
  try{const r=await sb("/rest/v1/games?id=eq."+g.id,{method:"DELETE"});if(!r.ok)throw 0;U.games.splice(+i,1);render();search()}catch(x){alert(t("eNet"))}
};

let found={},tm,pendCover="";
function showRes(list,raw,done){
  let html=list.map(g=>`<div class="row"><div class="it">${cvHtml(g.name,g.cover)}<span class="name">${esc(g.name)}</span></div>${done.has(norm(g.name))?'<span class="mut">'+t("inList")+'</span>':`<button class="sm" data-add="${esc(g.name)}" type="button">${t("done")}</button>`}</div>`).join("");
  if(!list.some(g=>norm(g.name)===norm(raw))&&!done.has(norm(raw)))html+=`<div class="row"><span class="mut">${t("addQ")} “${esc(raw)}”</span><button class="ghost sm" data-add="${esc(raw)}" type="button">${t("add")}</button></div>`;
  list.forEach(g=>found[g.name]=g.cover||"");
  $("res").innerHTML=html;
}
function search(){
  const raw=$("q").value.trim(),q=norm(raw);
  if(!q){$("res").innerHTML="";return}
  const done=new Set(me_().games.map(x=>norm(x.name)));
  const local=CAT.filter(n=>norm(n).includes(q)).slice(0,8).map(name=>({name}));
  if(!RAWG_KEY){showRes(local,raw,done);return}
  clearTimeout(tm);
  tm=setTimeout(async()=>{
    try{
      const r=await fetch("https://api.rawg.io/api/games?key="+RAWG_KEY+"&page_size=8&search="+encodeURIComponent(raw));
      const d=await r.json();
      if($("q").value.trim()!==raw)return;
      showRes((d.results||[]).map(g=>({name:g.name,cover:g.background_image})),raw,done);
    }catch(e){showRes(local,raw,done)}
  },350);
}
$("q").oninput=search;
$("res").onclick=e=>{const n=e.target.dataset.add;if(n){pending=n;pendCover=found[n]||"";$("pcv").innerHTML=cvHtml(n,pendCover);$("cvUrl").value="";$("cvMsg").textContent="";$("pname").textContent=n;$("score").value=8;$("sv").textContent="8";$("pend").classList.remove("hide");$("res").innerHTML=""}};
$("score").oninput=()=>$("sv").textContent=$("score").value;
$("cancel").onclick=()=>{pending=null;$("pend").classList.add("hide");search()};
$("save").onclick=async()=>{
  if(!pending)return;
  const row={name:pending,cover:pendCover||null,score:parseFloat($("score").value),date:new Date().toLocaleDateString(prefs.lang==="en"?"en-GB":"pt-PT")};
  $("save").disabled=true;
  try{
    const r=await sb("/rest/v1/games",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(row)});
    if(!r.ok)throw 0;
    const d=await r.json();U.games.push(d[0]);
  }catch(e){alert(t("eNet"));$("save").disabled=false;return}
  $("save").disabled=false;
  pending=null;$("pend").classList.add("hide");$("q").value="";render();search();
};
$("saveName").onclick=async()=>{
  const n=$("newName").value.trim(),m=$("pmsg");
  if(n.length<3||n.length>20){m.className="err";m.textContent=t("nameShort");return}
  try{
    const r=await sb("/auth/v1/user",{method:"PUT",body:JSON.stringify({data:{name:n}})});
    if(!r.ok)throw 0;
    U.name=n;m.className="err ok";m.textContent=t("nameOk");head();
  }catch(e){m.className="err";m.textContent=t("eNet")}
};
function prevCv(){if(pending)$("pcv").innerHTML=cvHtml(pending,pendCover)}
$("cvUrl").oninput=()=>{const v=$("cvUrl").value.trim();pendCover=/^https?:\/\//i.test(v)?v:"";prevCv()};
$("cvPick").onclick=()=>$("cvFile").click();
$("cvFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);pendCover=c.toDataURL("image/jpeg",.8);$("cvUrl").value="";$("cvMsg").textContent="";prevCv()};
    im.onerror=()=>{$("cvMsg").textContent=t("cvBad")};
    im.src=rd.result};
  rd.onerror=()=>{$("cvMsg").textContent=t("cvBad")};
  rd.readAsDataURL(f);e.target.value="";
};
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
applyTheme();setMode("login");applyLang();boot();
</script>
</body>
</html>
